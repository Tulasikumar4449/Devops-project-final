name: CI Pipeline

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

  build-and-push:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Prepare registry metadata
        id: meta
        shell: bash
        run: |
          if [[ -n "${{ secrets.REGISTRY_URL }}" && -n "${{ secrets.REGISTRY_USERNAME }}" && -n "${{ secrets.REGISTRY_PASSWORD }}" ]]; then
            echo "registry=${{ secrets.REGISTRY_URL }}" >> "$GITHUB_OUTPUT"
            echo "use_custom=true" >> "$GITHUB_OUTPUT"
          else
            owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
            echo "registry=ghcr.io/${owner}" >> "$GITHUB_OUTPUT"
            echo "use_custom=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to registry with custom credentials
        if: ${{ steps.meta.outputs.use_custom == 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Log in to GHCR with GitHub token
        if: ${{ steps.meta.outputs.use_custom != 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.registry }}/hello-devops:latest
