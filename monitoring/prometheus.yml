global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: nomad
    metrics_path: /v1/metrics
    params:
      format: [prometheus]
    static_configs:
      - targets: ["host.docker.internal:4646"]

  - job_name: consul
    metrics_path: /v1/agent/metrics
    params:
      format: [prometheus]
    static_configs:
      - targets: ["host.docker.internal:8500"]

  - job_name: vault
    metrics_path: /v1/sys/metrics
    params:
      format: [prometheus]
    static_configs:
      - targets: ["host.docker.internal:8200"]